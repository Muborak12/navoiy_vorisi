<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suyima Gʻaniyeva — hayoti va ilmiy faoliyati</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%}
  body{background:#F4D5D5;color:#3A2323;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;user-select:none}
  .serif{font-family:'Playfair Display',serif}
  .slide{position:absolute;inset:0;padding:.75rem;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(10px);transition:all .45s cubic-bezier(.16,1,.3,1)}
  .slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;z-index:5}
  .card{background:rgba(255,245,245,.7);border:1px solid rgba(58,35,35,.18);box-shadow:0 12px 32px -12px rgba(58,35,35,.18)}
  .pill{background:rgba(255,255,255,.5);border:1px solid rgba(58,35,35,.15)}
  .scroll::-webkit-scrollbar{width:4px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(58,35,35,.25);border-radius:4px}
  @media(min-width:768px){.slide{padding:1.25rem 2rem}}
</style>
</head>
<body class="flex flex-col antialiased">

<header class="z-20 px-4 md:px-6 py-3 flex items-center justify-between gap-3 border-b border-[#3A2323]/10 bg-[#F4D5D5]/90">
  <div class="flex items-center gap-2 min-w-0">
    <span class="w-2.5 h-2.5 rounded-full bg-[#3A2323] shrink-0"></span>
    <span class="text-[11px] md:text-xs uppercase tracking-[0.15em] font-semibold truncate">Oʻzbekiston Qahramoni · Navoiyshunoslik</span>
  </div>
  <span id="topic" class="hidden lg:block text-xs font-semibold uppercase tracking-wider"></span>
  <span class="pill px-3 py-1.5 rounded-full text-[11px] md:text-xs font-bold whitespace-nowrap">Muallif: Mirbositova 107-guruh</span>
</header>

<main id="stage" class="relative flex-1 min-h-0 w-full max-w-7xl mx-auto"></main>

<footer class="z-20 px-4 md:px-6 py-3 border-t border-[#3A2323]/10 bg-[#F4D5D5]/90 flex items-center justify-between gap-4">
  <div class="flex items-center gap-3 flex-1 md:flex-none">
    <span id="ind" class="text-xs font-mono font-bold whitespace-nowrap">01 / 15</span>
    <div class="w-full md:w-56 h-1.5 bg-[#3A2323]/15 rounded-full overflow-hidden"><div id="bar" class="h-full bg-[#3A2323] transition-all duration-300"></div></div>
  </div>
  <div id="pips" class="hidden lg:flex items-center gap-1.5"></div>
  <div class="flex gap-2">
    <button id="prev" class="pill px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-white/80 active:scale-95 transition disabled:opacity-40">← Oldingi</button>
    <button id="next" class="bg-[#3A2323] text-[#F4D5D5] px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-[#5A3636] active:scale-95 transition">Keyingi →</button>
  </div>
</footer>

<script>
const AUTHOR = "Mirbositova 107-guruh";
/* Har bir slayd: k — bo‘lim nomi, t — sarlavha, p — matn xatboshilari, f — asosiy faktlar [yorliq, qiymat], s — chap paneldagi izoh */
const S = [
 { k:"Kirish", t:"Suyima Gʻaniyeva — navoiyshunos olima, Oʻzbekiston Qahramoni",
   p:["Taqdimot Oʻzbekiston Qahramoni, filologiya fanlari doktori, professor Suyima Gʻaniyevaning hayot yoʻli, ilmiy faoliyati va Alisher Navoiy merosini oʻrganishdagi xizmatlariga bagʻishlanadi.",
      "Suyima Gʻaniyeva oʻzbek mumtoz adabiyotshunosligi, xususan, navoiyshunoslik sohasining yetakchi mutaxassislaridan biri sifatida tanilgan. U ilmiy tadqiqotlar olib borish bilan birga, koʻplab ilmiy kadrlarni tayyorlashga ham hissa qoʻshgan.",
      "Mazkur taqdimotda olimaning tarjimai holi, taʼlimi, mehnat faoliyati, ilmiy kashfiyotlari, asosiy asarlari va davlat mukofotlari izchil bayon etiladi."],
   f:[["Mavzu","Hayoti va ilmiy merosi"],["Yoʻnalish","Navoiyshunoslik"],["Muallif",AUTHOR]], s:"Kirish" },
 { k:"Tarjimai hol", t:"Hayot yoʻlining boshlanishi",
   p:["Suyima Gʻaniyeva 1932-yil 20-fevralda Toshkent shahrida ishchilar oilasida tugʻilgan. Uning bolalik va oʻsmirlik davri Ikkinchi jahon urushi hamda urushdan keyingi qiyin yillarga toʻgʻri keldi.",
      "Shunga qaramay, u yoshlikdan ilm olishga va kitob oʻqishga qiziqish bildirgan. Bu qiziqish keyinchalik uning sharqshunoslik va adabiyotshunoslik yoʻnalishini tanlashiga asos boʻldi.",
      "Olimaning hayoti 86 yil davom etib, deyarli butun faol umri ilmiy izlanish va pedagogik faoliyatga sarflandi."],
   f:[["Tugʻilgan sana","1932-yil 20-fevral"],["Tugʻilgan joyi","Toshkent shahri"],["Oilasi","Ishchilar oilasi"],["Umr davomiyligi","86 yil"]], s:"1932" },
 { k:"Taʼlim", t:"Taʼlim olishi va aspirantura yillari",
   p:["1952-yilda Oʻrta Osiyo davlat universiteti (hozirgi Oʻzbekiston Milliy universiteti)ning sharqshunoslik fakultetini tamomlagan. Universitetda sharq tillari, mumtoz adabiyot va matnshunoslik asoslarini chuqur oʻrgangan.",
      "1953–1956-yillarda Leningrad davlat universiteti aspiranturasida taʼlimini davom ettirgan. Bu yillarda u mashhur sharqshunos olimlar rahbarligida ilmiy tadqiqot usullarini egallagan, qoʻlyozma manbalar bilan ishlash malakasini oshirgan.",
      "Aspirantura davrida shakllangan ilmiy bilim va tajriba uning keyingi barcha tadqiqotlarining poydevori boʻldi."],
   f:[["1952-yil","Sharqshunoslik fakultetini tamomlagan"],["1953–1956","Leningrad davlat universiteti aspiranturasi"]], s:"1952–1956" },
 { k:"Dissertatsiya", t:"Nomzodlik dissertatsiyasi himoyasi",
   p:["1956-yilda Suyima Gʻaniyeva Alisher Navoiy ijodiga oid nomzodlik dissertatsiyasini muvaffaqiyatli himoya qildi. Shu bilan u navoiyshunoslik sohasidagi mustaqil ilmiy faoliyatini boshlab berdi.",
      "Oʻsha davrda mumtoz adabiyot tadqiqotlari bilan shugʻullanuvchi ayol olimlar kam edi. Uning tadqiqotlari ilmiy jamoatchilik eʼtiborini tez orada tortdi.",
      "Dissertatsiyada ishlab chiqilgan yondashuvlar keyinchalik olimaning monografiyalari va maqolalarida rivojlantirildi."],
   f:[["Himoya yili","1956"],["Ilmiy daraja","Fan nomzodi"],["Tadqiqot obyekti","Alisher Navoiy ijodi"]], s:"1956" },
 { k:"Ilmiy faoliyat", t:"Oʻzbekiston Fanlar akademiyasidagi faoliyati",
   p:["Olima mehnat faoliyatini Oʻzbekiston Fanlar akademiyasining Til va adabiyot institutida boshlagan. Dastlab kichik ilmiy xodim sifatida ishlagan, keyinchalik institutning ilmiy kotibi va boʻlim mudiri lavozimlarida faoliyat yuritgan.",
      "Institutda u mumtoz adabiyot namunalarini nashrga tayyorlash, qoʻlyozmalarni tavsiflash va ularning matnini ilmiy tahlil qilish ishlarida ishtirok etgan.",
      "Bu faoliyat unga ilmiy-tashkiliy ishlarni boshqarish tajribasini ham berdi."],
   f:[["Ish joyi","Til va adabiyot instituti"],["Lavozimlari","Kichik ilmiy xodim → ilmiy kotib → boʻlim mudiri"]], s:"Akademiya" },
 { k:"Pedagogik faoliyat", t:"Oliy taʼlim tizimidagi pedagogik faoliyati",
   p:["Suyima Gʻaniyeva uzoq yillar oliy oʻquv yurtlarida dars bergan va professor lavozimida ishlagan. U Toshkent davlat sharqshunoslik institutida mumtoz filologiya yoʻnalishi boʻyicha ilmiy-pedagogik faoliyat olib bordi.",
      "Olima talabalarga mumtoz adabiyot, matnshunoslik va Navoiy ijodi boʻyicha maxsus kurslar oʻqigan, oʻquv dasturlari va uslubiy materiallar tayyorlashda qatnashgan.",
      "Uning rahbarligida bir qator yosh tadqiqotchilar ilmiy daraja olgan, bu esa navoiyshunoslik maktabining davomiyligini taʼminlagan."],
   f:[["Unvoni","Professor"],["Yoʻnalishi","Mumtoz filologiya"],["Ilmiy rahbarlik","Yosh tadqiqotchilar tayyorlash"]], s:"Ustoz" },
 { k:"Ilmiy kashfiyot", t:"«Munojot» asari boʻyicha tadqiqotlari",
   p:["Olimaning eng muhim ilmiy yutuqlaridan biri Alisher Navoiyning «Munojot» asarini ilmiy muomalaga kiritish va uning matnini tadqiq etish bilan bogʻliq deb taʼriflanadi.",
      "Asarning matni qoʻlyozma manbalar asosida solishtirilib, mazmuni va gʻoyaviy xususiyatlari tahlil qilindi. Tadqiqotda Navoiyning diniy-tasavvufiy qarashlari va ruhiy dunyosi yoritildi.",
      "Bu ish navoiyshunoslikda manbashunoslik va matnshunoslik yoʻnalishlari rivojiga xizmat qildi."],
   f:[["Asar","«Munojot»"],["Usul","Qoʻlyozmalar asosida matnshunoslik tahlili"],["Natija","Asar matni va mazmuni ilmiy yoritildi"]], s:"Munojot" },
 { k:"Tadqiqot yoʻnalishlari", t:"Asosiy ilmiy yoʻnalishlari",
   p:["Suyima Gʻaniyevaning tadqiqotlari Alisher Navoiy hayoti va ijodi, uning gʻazalchiligi, dostonlari hamda ijodiy merosining adabiyotshunoslikdagi oʻrnini oʻrganishga qaratilgan.",
      "Olima Navoiy asarlarining gʻoyaviy mazmuni, badiiy xususiyatlari va tarixiy-madaniy muhit bilan aloqasini tahlil qilgan. Shuningdek, shoirning insonparvarlik qarashlari alohida eʼtibor markazida boʻlgan.",
      "Uning ishlari oʻzbek mumtoz adabiyotini ilmiy asosda oʻrganishda muhim manba hisoblanadi."],
   f:[["1","Navoiy hayoti va ijodi"],["2","Gʻazalchilik va doston"],["3","Insonparvarlik gʻoyalari"],["4","Matnshunoslik va manbashunoslik"]], s:"Yoʻnalishlar" },
 { k:"Ilmiy meros", t:"Ilmiy merosining hajmi",
   p:["Olima oʻzidan katta ilmiy meros qoldirgan. Uning qalamiga monografiyalar, koʻplab ilmiy maqolalar hamda oliy oʻquv yurtlari talabalari uchun darslik va oʻquv qoʻllanmalari mansub.",
      "Ilmiy ishlari mamlakat ichida va tashqarisida nashr etilgan, adabiyotshunoslar va talabalar tomonidan manba sifatida foydalaniladi.",
      "Quyidagi koʻrsatkichlar manbalarda keltirilgan umumiy maʼlumotlarga asoslangan boʻlib, taqdimot oldidan rasmiy manbalar bilan yana bir bor tekshirilishi tavsiya etiladi."],
   f:[["14","Monografiya"],["350+","Ilmiy maqola"],["20+","Darslik va qoʻllanma"]], s:"Meros" },
 { k:"Asarlar (I)", t:"Asosiy monografiyalari — 1-qism",
   p:["Olimaning asarlari orasida «Alisher Navoiy hayoti va ijodi» hamda «Alisher Navoiy ijodidagi insonparvarlik gʻoyalari» nomli ishlar alohida oʻrin tutadi.",
      "Ularda Navoiyning hayot yoʻli, ijodiy faoliyati, jamiyatdagi mavqei va inson qadr-qimmatiga oid qarashlari ilmiy jihatdan tahlil qilingan.",
      "Mazkur kitoblar talabalar, oʻqituvchilar va adabiyotshunoslar uchun muhim oʻquv va ilmiy manba boʻlib xizmat qiladi."],
   f:[["Asar","Alisher Navoiy hayoti va ijodi"],["Asar","Alisher Navoiy ijodidagi insonparvarlik gʻoyalari"]], s:"Asarlar I" },
 { k:"Asarlar (II)", t:"Asosiy monografiyalari — 2-qism",
   p:["Shuningdek, «Navoiy gʻazallarida zodagonlik motivlari», «Navoiyning vasiyati» va «Navoiyning avtografi» kabi asarlari ham ilmiy jamoatchilikka maʼlum.",
      "Bu asarlarda shoirning gʻazallaridagi mavzular, uning vasiyatiga oid maʼlumotlar hamda qoʻlyozma va avtograf masalalari tahlil qilingan.",
      "Tadqiqotlar Navoiy shaxsiyati va ijodiy jarayonini chuqurroq tushunishga yordam beradi."],
   f:[["Asar","Navoiy gʻazallarida zodagonlik motivlari"],["Asar","Navoiyning vasiyati"],["Asar","Navoiyning avtografi"]], s:"Asarlar II" },
 { k:"Davlat mukofoti", t:"«Oʻzbekiston Qahramoni» unvoni",
   p:["Olimaning ilm-fan va maʼnaviyat sohasidagi xizmatlari davlat tomonidan yuksak baholangan. 1994-yil 5-mayda Oʻzbekiston Respublikasi Prezidenti farmoni bilan unga «Oʻzbekiston Qahramoni» unvoni berilgan.",
      "Bu unvon Oʻzbekiston Respublikasining eng oliy unvoni hisoblanadi va Oltin Yulduz medali bilan taqdirlanadi.",
      "Unvon olimaning navoiyshunoslik, mumtoz adabiyotni asrab-avaylash va ilmiy kadrlar tayyorlashdagi xizmatlariga berilgan baho sifatida qaraladi."],
   f:[["Sana","1994-yil 5-may"],["Unvon","Oʻzbekiston Qahramoni"],["Belgi","Oltin Yulduz medali"]], s:"1994" },
 { k:"Ordenlar", t:"Boshqa davlat mukofotlari",
   p:["Oliy unvondan tashqari, Suyima Gʻaniyeva boshqa davlat mukofotlari bilan ham taqdirlangan.",
      "1996-yil 29-avgustda «Buyuk xizmatlari uchun» ordeni, 1998-yil 28-avgustda esa «El-yurt hurmati» ordeni bilan mukofotlangan.",
      "Bu mukofotlar uning ilmiy, pedagogik va jamoat faoliyati davlat va jamiyat tomonidan eʼtirof etilganini koʻrsatadi."],
   f:[["1996-yil","«Buyuk xizmatlari uchun» ordeni"],["1998-yil","«El-yurt hurmati» ordeni"]], s:"Ordenlar" },
 { k:"Vafoti", t:"Vafoti va xotirasi",
   p:["Suyima Gʻaniyeva 2018-yil 1-sentabr kuni 86 yoshida Toshkent shahrida vafot etdi.",
      "Olimaning asarlari, shogirdlari va ilmiy gʻoyalari bugun ham navoiyshunoslik rivojiga xizmat qilmoqda. Uning kitoblari oliy taʼlim muassasalarida va ilmiy tadqiqotlarda foydalanilmoqda.",
      "Uning xotirasi Oʻzbekiston adabiyotshunosligi tarixida hurmat bilan saqlanadi."],
   f:[["Vafot sanasi","2018-yil 1-sentabr"],["Yoshi","86"],["Vafot joyi","Toshkent shahri"]], s:"1932–2018" },
 { k:"Xulosa", t:"Xulosa",
   p:["Suyima Gʻaniyeva oʻzbek adabiyotshunosligida, ayniqsa navoiyshunoslik sohasida, katta ilmiy meros qoldirgan olimadir. U tadqiqotchi, matnshunos va ustoz sifatida faoliyat yuritdi.",
      "Olimaning asarlari Alisher Navoiy ijodini oʻrganishda, mumtoz adabiyotni ilmiy asosda tushunishda va yosh avlodni maʼnaviy tarbiyalashda muhim ahamiyatga ega.",
      "Eʼtiboringiz uchun rahmat! Muallif: " + AUTHOR + "."],
   f:[["Asosiy natija","Ilmiy va pedagogik meros"],["Taqdimot muallifi",AUTHOR]], s:"Rahmat" }
];

const N = S.length, stage = document.getElementById('stage');
S.forEach((d,i)=>{
  const n = String(i+1).padStart(2,'0');
  const facts = d.f.map(([a,b])=>`<div class="p-3 rounded-xl bg-[#3A2323]/5 border border-[#3A2323]/10"><span class="block text-[11px] font-mono uppercase tracking-wider text-[#3A2323]/65">${a}</span><strong class="text-sm md:text-base">${b}</strong></div>`).join('');
  const paras = d.p.map(x=>`<p>${x}</p>`).join('');
  const el = document.createElement('section');
  el.className = 'slide' + (i===0?' active':'');
  el.dataset.title = d.k;
  el.innerHTML = `<div class="card h-full w-full rounded-2xl md:rounded-3xl overflow-hidden grid grid-rows-[auto_1fr] md:grid-rows-1 md:grid-cols-12">
    <aside class="md:col-span-3 bg-[#3A2323] text-[#F4D5D5] p-5 md:p-8 flex md:flex-col justify-between items-center md:items-start gap-3">
      <span class="serif text-5xl md:text-8xl font-bold leading-none opacity-90">${n}</span>
      <div class="text-right md:text-left">
        <div class="text-[11px] uppercase tracking-[0.2em] opacity-70">${d.k}</div>
        <div class="serif text-xl md:text-3xl font-semibold mt-1">${d.s}</div>
      </div>
    </aside>
    <div class="md:col-span-9 scroll overflow-y-auto p-5 md:p-10 flex flex-col justify-center gap-4 md:gap-6">
      <h2 class="serif text-2xl md:text-4xl font-bold leading-tight">${d.t}</h2>
      <div class="space-y-3 text-sm md:text-lg leading-relaxed text-[#3A2323]/90">${paras}</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 ${d.f.length>=3?'lg:grid-cols-3':''} gap-3">${facts}</div>
    </div>
  </div>`;
  stage.appendChild(el);
});

let cur = 0;
const slides = stage.children, pips = document.getElementById('pips');
for(let i=0;i<N;i++){const b=document.createElement('button');b.setAttribute('aria-label','Slayd '+(i+1));b.onclick=()=>go(i);pips.appendChild(b);}
function go(i){
  if(i<0||i>=N) return; cur=i;
  [...slides].forEach((s,j)=>s.classList.toggle('active',j===i));
  document.getElementById('ind').textContent = String(i+1).padStart(2,'0')+' / '+N;
  document.getElementById('bar').style.width = ((i+1)/N*100)+'%';
  document.getElementById('topic').textContent = 'Slayd '+(i+1)+' / '+N+' — '+slides[i].dataset.title;
  [...pips.children].forEach((p,j)=>{p.className='h-2 rounded-full transition-all '+(j===i?'w-5 bg-[#3A2323]':'w-2 bg-[#3A2323]/25 hover:bg-[#3A2323]/60');});
  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').textContent = i===N-1 ? '↺ Boshiga' : 'Keyingi →';
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur===N-1?0:cur+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft') go(cur-1);
});
let sx=0;
addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;});
addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-sx;if(d<-50)go(cur+1);else if(d>50)go(cur-1);});
go(0);
</script>
</body>
</html>
